<!DOCTYPE html>

    <title>Instagram Gift</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Instagram */
        .instagram {
            margin-top: 45px;
            width: 65px;
            height: 65px;
            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #833ab4,
                #fd1d1d,
                #fcb045
            );

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .instagram::before {
            content: "";
            width: 35px;
            height: 35px;
            border: 4px solid white;
            border-radius: 10px;
            position: absolute;
        }

        .instagram::after {
            content: "";
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 14px;
            right: 14px;
        }

        .camera-circle {
            width: 13px;
            height: 13px;
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
        }

        /* Form */
        .container {
            width: 90%;
            max-width: 400px;

            margin-top: 18vh;

            text-align: center;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 35px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 16px;

            margin-bottom: 18px;

            border: 1px solid #ddd;
            border-radius: 12px;

            font-size: 16px;
            text-align: right;

            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #999;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
        }

        button {
            width: 100%;
            padding: 16px;

            border: none;
            border-radius: 12px;

            background: #25D366;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        .small-text {
            margin-top: 15px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
